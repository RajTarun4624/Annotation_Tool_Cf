services:
  db:
    image: postgres:16-alpine
    container_name: promptattack_db
    restart: always
    # Tuned for ~4 API workers x 20 connections plus admin tools, on a host
    # with >= 4 GB RAM. Adjust shared_buffers/effective_cache_size to ~25% /
    # ~60% of the RAM you give Postgres.
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c log_min_duration_statement=500
    environment:
      POSTGRES_DB: annotation_tool_promptattack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASS:-1234}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 3g
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d annotation_tool_promptattack"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: promptattack_backend
    restart: always
    # Run migrations first, then serve on 8005 (the port the frontend nginx
    # proxies to and the healthcheck below probes) with several gunicorn/uvicorn
    # worker processes. The DB wait is handled by depends_on: service_healthy.
    # Migrations are non-fatal (same as entrypoint.sh): the app also ensures the
    # schema at startup, idempotently and under an advisory lock.
    command: sh -c "alembic upgrade head || echo 'alembic failed; continuing'; export PORT=8005; exec gunicorn -c gunicorn.conf.py app.main:app"
    deploy:
      resources:
        limits:
          memory: 2g
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    environment:
      APP_NAME: Prompt Attack Annotation Platform API
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: annotation_tool_promptattack
      DB_USER: postgres
      DB_PASS: "${DB_PASS:-1234}"
      MAINTENANCE_DB: postgres
      # Capacity: WEB_CONCURRENCY x (DB_POOL_SIZE + DB_MAX_OVERFLOW) must stay
      # below Postgres max_connections (200 above): 4 x 20 = 80.
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-4}"
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "10"
      SECRET_KEY: "${SECRET_KEY:-CHANGE_ME_TO_A_LONG_RANDOM_VALUE}"
      UPLOAD_FOLDER: uploads
      # Static frontend is also mounted into the backend so the API host serves
      # the app same-origin at http://localhost:8005/ (the nginx frontend
      # service on port 80 is the primary entry point).
      FRONTEND_DIR: /app/frontend
      CORS_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:8005,http://127.0.0.1:8005
      DEFAULT_ADMIN_EMAIL: "${DEFAULT_ADMIN_EMAIL:-admin@gmail.com}"
      # Used only when the account does not exist yet; never rewritten on restart.
      DEFAULT_ADMIN_PASSWORD: "${DEFAULT_ADMIN_PASSWORD:-Admin@123}"
    volumes:
      - backend_uploads:/app/uploads
      - ./frontend:/app/frontend:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: promptattack_frontend
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
