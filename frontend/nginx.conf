# Frontend edge: static pages + API proxy.
#
# Static assets are versioned by query string (js/app.js?v=...), so they get a
# long immutable cache; HTML pages are revalidated on every load so a deploy
# is picked up immediately. Text assets are gzip-compressed.

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json application/x-ndjson image/svg+xml;

# Keep-alive to the API so 200 concurrent annotators do not pay a TCP
# handshake per request.
upstream api_backend {
    server backend:8005;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HTML: always revalidate (cheap 304s via ETag/Last-Modified).
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Versioned assets: cache for a year; the ?v= query changes on deploy.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static pages (login, dashboard, queues, ...). Unknown paths fall back to
    # the login page.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # REST API -> FastAPI backend (compose service "backend", port 8005).
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Exports stream straight through instead of being buffered to disk.
        proxy_buffering off;
        client_max_body_size 100m;
    }

    location /health {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
